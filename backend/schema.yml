components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 80
        object_type:
          type: string
          maxLength: 80
        object_id:
          type: string
          maxLength: 64
        club:
          type: string
          format: uuid
          nullable: true
        old_values: {}
        new_values: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_name
      - created_at
      - id
      - object_id
      - object_type
    BlankEnum:
      enum:
      - ''
    Club:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        description:
          type: string
        zone:
          type: string
          maxLength: 120
        currency:
          type: string
          maxLength: 3
        leader:
          type: integer
        leader_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ClubStatusEnum'
        interest_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        penalty_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        platform_fee_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        min_loan:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        max_loan:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        min_duration_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_duration_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        withdrawal_notice_days:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        member_count:
          type: integer
          readOnly: true
        finances:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - finances
      - id
      - leader
      - leader_name
      - member_count
      - name
      - zone
    ClubMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        club:
          type: string
          format: uuid
        club_name:
          type: string
          readOnly: true
        sender_id:
          type: integer
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        recipient:
          type: integer
          nullable: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        body:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - club
      - club_name
      - created_at
      - id
      - sender_id
      - sender_name
      - updated_at
    ClubStatusEnum:
      enum:
      - draft
      - active
      - suspended
      - frozen
      - archived
      type: string
      description: |-
        * `draft` - Brouillon
        * `active` - Actif
        * `suspended` - Suspendu
        * `frozen` - Gele
        * `archived` - Archive
    Deposit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
        club:
          type: string
          format: uuid
        club_name:
          type: string
          readOnly: true
        lender:
          type: integer
        lender_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        payment_method:
          type: string
          maxLength: 40
        provider_reference:
          type: string
          maxLength: 100
        proof:
          type: string
          format: uri
        status:
          allOf:
          - $ref: '#/components/schemas/DepositStatusEnum'
          readOnly: true
        decision_reason:
          type: string
          readOnly: true
        validated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - club
      - club_name
      - created_at
      - decision_reason
      - id
      - lender
      - lender_name
      - reference
      - status
      - validated_at
    DepositStatusEnum:
      enum:
      - draft
      - pending
      - validated
      - rejected
      - cancelled
      type: string
      description: |-
        * `draft` - Brouillon
        * `pending` - En attente
        * `validated` - Valide
        * `rejected` - Refuse
